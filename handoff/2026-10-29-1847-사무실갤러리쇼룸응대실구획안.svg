<svg xmlns="http://www.w3.org/2000/svg" width="760" height="880" viewBox="0 0 380 440" role="img">
<title>사무실 배치 제안: 갤러리 존과 아늑한 응대실로 구획 (2·4·5·12번 제거)</title>
<desc>입구와 창문 쪽은 갤러리 존, 낮은 전시 칸막이 14번과 연장한 3번 가벽 안쪽은 러그와 조명이 있는 아늑한 응대실로 나눈 배치 제안. 2번, 4번, 5번, 12번은 제거됨.</desc>
