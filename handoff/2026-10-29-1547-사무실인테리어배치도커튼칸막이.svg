<desc>9번 커튼은 통로 폭 0.8m를 뺀 구간에 달려 있고, 10번 통로로 들어가면 안쪽 y 5.0m에 칸막이 13번이 서서 응대 구역에서 통로 너머가 보이지 않으며, 7번 책상과 의자는 칸막이 오른쪽으로 옮긴 배치도. 천장 높이는 2.7m, 통로 폭은 0.8m로 확인됨.</desc>
