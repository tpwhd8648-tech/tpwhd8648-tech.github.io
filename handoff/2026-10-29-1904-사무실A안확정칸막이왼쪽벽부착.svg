<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 380 340" role="img">
<title>사무실 배치 A안 수정: 칸막이를 왼쪽 벽에 붙이고 입구 쪽을 열어 바로 응대실로 들어가는 배치 (2·4·5·12·3번 제거)</title>
<desc>14번 칸막이를 왼쪽 벽에서 시작해 폭 3.1m로 세우고, 입구 아래 오른쪽 1.2m를 열어 문을 열면 갤러리 존이 보이고 바로 응대실로 들어갈 수 있는 배치. 3번 가벽과 2번, 4번, 5번, 12번은 제거됨.</desc>
