svg{--s:#5F5E5A;--border-stronger:#5F5E5A;--border-strong:#888780}
text{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.leader{stroke:#888780;stroke-width:.5;stroke-dasharray:3 3}
.box{fill:#F1EFE8;stroke:#888780}
.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}
.c-amber>.th{fill:#633806}
